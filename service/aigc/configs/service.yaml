# 仅由服务端管理，不读取 ~/.ms_agent 的 MCP、plugin 或项目配置。
server:
  workers: 1
  host: "${AIGC_HOST:0.0.0.0}"
  port: "${AIGC_PORT:8000}"
  max_body_bytes: 1048576
  keep_alive_timeout: 75
  graceful_shutdown_timeout: 30
  limit_concurrency: 1024
  public_path_prefix: "${AIGC_PUBLIC_PATH_PREFIX:}"
  loop: auto
  http: auto
  access_log: false

auth:
  header: "${AIGC_AUTH_HEADER:Authorization}"
  scheme: "${AIGC_AUTH_SCHEME:bearer}"

storage:
  data_dir: "${DATA_DIR:/data}"
  cache_entries: 256
  cache_bytes: 67108864
  projection: terminal
  lease_wait: 0
  lock_policy: require
  epoch_check_interval: 5
  io_workers: 8

runtime:
  max_active_runs: "${AIGC_MAX_RUNS:64}"
  max_inflight_runs: "${AIGC_MAX_INFLIGHT:500}"
  queue_limit: "${AIGC_QUEUE_LIMIT:}"  # 兼容旧等待容量；与 AIGC_MAX_INFLIGHT 互斥
  per_user_active: 4
  per_user_inflight: 20
  interaction_timeout: 1800
  drain_timeout: "${AIGC_DRAIN_TIMEOUT:60}"
  retry_after: 2

events:
  heartbeat_seconds: 15
  max_stream_seconds: 540
  max_subscribers: 512

# rpm=0 表示未设置本地 RPM 限制，生产需按账户实际配额设置。
upstreams:
  llm:
    concurrency: 32
    rpm: 0
    connections: 64
    connect_timeout: 10
    read_timeout: 300
    retry: {attempts: 3, initial: 1, maximum: 30, budget: 300}
  submit:
    concurrency: 8
    rpm: 0
    connections: 64
    connect_timeout: 10
    read_timeout: 60
    retry: {attempts: 3, initial: 1, maximum: 30, budget: 60}
  poll:
    concurrency: 32
    rpm: 0
    connections: 64
    connect_timeout: 10
    read_timeout: 60
    retry: {initial: 1, maximum: 30, budget: 600}

recipe:
  concurrency: 1
  max_inflight: 100
  timeout: 120

observability:
  metrics_enabled: "${AIGC_METRICS_ENABLED:false}"
  metrics_interval: 10
  metrics_endpoint: http://127.0.0.1:8080/api/builtin/realtime_metrics
  loop_sample_seconds: 0.2
  loop_window_samples: 1024
  metrics_timeout: 3
  json_logs: true

eas:
  enabled: "${AIGC_EAS_ENABLED:false}"
  gateway: "${AIGC_EAS_GATEWAY:none}"
  gateway_id: ""
  service_auth_header: X-AIGC-Service-Token
  service_auth_scheme: raw
  service_name: aigc
  image: ""
  instance: 1
  cpu: 2
  memory_mb: 4096
  rpc_keepalive_ms: 600000
  termination_grace_period: 120
  shutdown_margin: 10
  startup_budget: 300
  nas_server: ""
  nas_path: /aigc
  mount_path: /data

secrets:
  service: AIGC_SERVICE_TOKEN
  llm: LLM_API_KEY
  api: API_TOKEN

agent:
  max_chat_round: 20
  system_prompt: >-
    你是 AIGC 助手。只使用已声明的 HTTP API 工具。
    需要生成或编辑图片时保留参考图片 URL 的顺序，缺少参数时请求补充。
    不执行本地代码、不使用 sandbox，不展示内部推理过程。
  history: {max_messages: 40, max_chars: 60000}
  memory_enabled: true
  memory_projection: false
  memory_top_k: 5
  skill_dirs: []
  model: "${LLM_MODEL:qwen-plus}"
  base_url: "${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}"
  temperature: 0.7
  max_tokens: 4096

tools:
  api:
    base_url: "${API_BASE_URL:https://api-inference.modelscope.cn}"
    auth: {type: bearer}
    tools:
      - name: image_generation
        enabled: true
        requires_approval: true
        description: >-
          通过图片推理 HTTP API 生成或编辑图片。文生图不传 image_url；
          单图/多图编辑保持参考图顺序，最多 4 张。model 必须来自服务允许的可用模型。
          n 不保证实际出图数量，以返回列表为准。
        api:
          method: POST
          path: /v1/images/generations
          async_mode: true
          poll_path: /v1/tasks/{task_id}
          timeout: 60
          poll_interval: 5
          poll_timeout: 600
          poll_max_interval: 20
          poll_factor: 1.5
          headers:
            X-ModelScope-Async-Mode: "true"
            X-ModelScope-Task-Type: image_generation
        parameters:
          type: object
          additionalProperties: false
          required: [model, prompt]
          properties:
            model: {type: string, enum: [Qwen/Qwen-Image-2.1-Turbo]}
            prompt: {type: string, minLength: 1, maxLength: 4000}
            image_url:
              oneOf:
                - {type: string, pattern: '^https?://'}
                - type: array
                  minItems: 1
                  maxItems: 4
                  items: {type: string, pattern: '^https?://'}
            loras:
              oneOf:
                - {type: string, minLength: 1}
                - type: array
                  maxItems: 6
                  items: {type: string, minLength: 1}
                - type: object
                  maxProperties: 6
                  additionalProperties: {type: number}
            negative_prompt: {type: string, maxLength: 4000}
            size: {type: string, pattern: '^[0-9]{2,4}x[0-9]{2,4}$'}
            seed: {type: integer, minimum: -1, maximum: 2147483647}
            steps: {type: integer, minimum: 1, maximum: 50}
            guidance: {type: number, minimum: 1.5, maximum: 20}
            n: {type: integer, minimum: 1, maximum: 4}
            add_water_mark: {type: boolean}
        output_mapping:
          success_path: output_images
          error_path: errors.message
          task_id_path: task_id
          status_path: task_status
          success_statuses: [SUCCEED]
          failure_statuses: [FAILED, TIMEOUT]
